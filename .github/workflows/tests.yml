name: Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chromium, not Firefox: the committed visual baseline in
      # tests/screenshots/linux-chromium/ is what this run has to compare
      # against, and a baseline is per browser. A renderer with no committed
      # set writes one and skips, which would leave the layout unchecked here.
      - name: Install the browser the suite drives
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: pycodestyle app/ tests/ scripts/ run.py --max-line-length=100

      - name: Test
        run: pytest tests/ -q

      # TEMPORAL: sube las capturas nuevas para regenerar la línea base visual.
      - name: Upload actual screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: actual-screenshots
          path: tests/screenshots/linux-chromium/*.actual.png
          retention-days: 1
