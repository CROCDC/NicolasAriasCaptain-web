name: Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install the browser the suite drives
        run: python -m playwright install --with-deps firefox

      - name: Lint
        run: pycodestyle app/ tests/ scripts/ run.py --max-line-length=100

      - name: Test
        run: pytest tests/ -q
