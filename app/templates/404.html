{% import "_macros.html" as ui %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>{{ t('error.pestana') }} — {{ site.brand }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}" />
  <style>{{ critical_css }}</style>
  <link rel="stylesheet" href="{{ asset('css/style-deferred.css') }}" />
  {{ ui.analytics() }}
</head>
<body>
  <main class="lost">
    <div>
      {{ ui.mark('lost-mark') }}
      <h1 class="lost-code">404</h1>
      <p class="lost-title">{{ t('error.titulo') }}</p>
      <p class="lost-text">{{ t('error.texto') }}</p>
      <a class="btn btn-solid" href="{{ url_for('index') }}">{{ t('error.boton') }}</a>
    </div>
  </main>
</body>
</html>
