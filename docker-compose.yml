# Pinned so the project (and therefore the arias_db volume holding the contact
# form's SQLite file) keeps its name regardless of the checkout directory,
# which on the Pi is a Jenkins workspace path.
name: nicolas-arias-web

services:
  app:
    container_name: nicolas-arias-web-app
    build:
      context: .
      dockerfile: Dockerfile
    image: nicolas-arias-web-app
    environment:
      # TLS terminates at the Cloudflare Tunnel, so there is no LETSENCRYPT_*
      # here: nginx-proxy only has to route the host to this container.
      - VIRTUAL_HOST=nicolasarias.nexttech.com.ar
      - VIRTUAL_PORT=7000
      - DATABASE_URL=sqlite:////app/instance/arias.db
      - SECRET_KEY=${SECRET_KEY}
      # Opens the content panel at /admin/content. Same road as
      # SECRET_KEY: Infisical, injected by `infisical run` at deploy.
      # Missing means empty, and an empty one refuses every password —
      # a forgotten secret locks the panel rather than opening it.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Public by design — it ships inside the page, so it is a plain value and
      # deliberately not an Infisical secret.
      - UMAMI_WEBSITE_ID=47f4836b-a82e-421b-a144-6c7623b41354
      - FLASK_ENV=production
    ports:
      - "7000:7000"
    expose:
      - "7000"
    volumes:
      - arias_db:/app/instance
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - com.github.nginxproxy.nginx-proxy.startup_wait=30

  # The config is baked into the image rather than bind-mounted: Jenkins checks
  # the repo out into a named volume, so a ./promtail.yml mount resolves to
  # nothing on the host daemon and Docker creates a directory in its place.
  promtail:
    build:
      context: .
      dockerfile: Dockerfile.promtail
    image: nicolas-arias-web-promtail
    container_name: nicolas-arias-web-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - proxy

volumes:
  arias_db:

networks:
  proxy:
    external: true
